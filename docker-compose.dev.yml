services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: expenses-api-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expenses_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expenses-network-dev

  # API Application (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: expenses-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-expenses_db}?schema=public
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229" # Debug port
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./types:/app/types
      - /app/node_modules
      - /app/generated
    depends_on:
      db:
        condition: service_healthy
    command: pnpm dev
    networks:
      - expenses-network-dev

networks:
  expenses-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
